name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Package Release Artifact
        run: |
          python -c "
          import shutil, os
          os.makedirs('release_package', exist_ok=True)
          for item in ['dist', 'scripts', 'package.json', 'package-lock.json',
                       'install.bat', 'install.sh', 'install2.bat', 'install2.sh',
                       'launch.bat', 'launch.sh', 'docker-compose.cobalt.yml', 'README.md']:
              dst = os.path.join('release_package', os.path.basename(item))
              if os.path.isdir(item): shutil.copytree(item, dst)
              else: shutil.copy2(item, dst)
          shutil.make_archive('discord-obs-overlay-release', 'zip', 'release_package')
          "

      - name: Validate Docker Compose
        shell: bash
        run: docker compose -f docker-compose.cobalt.yml config --quiet

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: discord-obs-overlay-release.zip
