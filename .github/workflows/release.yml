name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + .blockmap are what electron-updater reads to find and
          # (delta-)download a new version, so they must be on the GitHub Release.
          - os: windows-latest
            target: win
            artifact_glob: |
              dist-electron/*Setup*.exe
              dist-electron/*Setup*.exe.blockmap
              dist-electron/latest.yml
          - os: macos-latest
            target: mac
            # No latest-mac.yml: macOS auto-update needs a signed build (see docs/CODE-SIGNING.md).
            artifact_glob: dist-electron/*.dmg
          - os: ubuntu-latest
            target: linux
            artifact_glob: |
              dist-electron/*.AppImage
              dist-electron/latest-linux.yml

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livechat-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
