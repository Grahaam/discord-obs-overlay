name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + .blockmap are what electron-updater reads to find and
          # (delta-)download a new version, so they must be on the GitHub Release.
          - os: windows-latest
            target: win
            artifact_glob: |
              dist-electron/*Setup*.exe
              dist-electron/*Setup*.exe.blockmap
              dist-electron/latest.yml
          - os: macos-latest
            target: mac
            # No latest-mac.yml: macOS auto-update needs a signed build (see docs/CODE-SIGNING.md).
            artifact_glob: dist-electron/*.dmg
          - os: ubuntu-latest
            target: linux
            artifact_glob: |
              dist-electron/*.AppImage
              dist-electron/latest-linux.yml

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livechat-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
