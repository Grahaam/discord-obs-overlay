<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>LiveChat — Setup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #36393f;
    color: #dcddde;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
  }
  .card {
    position: relative;
    background: #2f3136;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .lang { position: absolute; top: 16px; right: 16px; display: flex; border: 1px solid #202225; border-radius: 4px; overflow: hidden; }
  .lang button { width: auto; margin: 0; border-radius: 0; background: #40444b; color: #b9bbbe; font-size: 11px; padding: 4px 8px; }
  .lang button.active { background: #7289da; color: #fff; }
  h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #72767d; margin-bottom: 12px; }
  .steps { font-size: 12px; font-weight: 600; color: #7289da; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #b9bbbe; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field { margin-bottom: 20px; }
  input, select {
    width: 100%;
    background: #40444b;
    border: 1px solid #202225;
    border-radius: 4px;
    color: #dcddde;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: #7289da; }
  input.error { border-color: #ed4245; }
  option:disabled { color: #72767d; }
  ol { margin: 0 0 20px 20px; font-size: 14px; line-height: 1.5; }
  ol li { margin-bottom: 6px; }
  ol b { color: #fff; }
  .hint { font-size: 12px; color: #72767d; margin-top: 4px; }
  .err-msg { font-size: 12px; color: #ed4245; margin-top: 4px; display: none; }
  .err-msg.visible { display: block; }
  button {
    width: 100%;
    background: #7289da;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
    margin-top: 8px;
  }
  button.secondary { background: #4f545c; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row select { flex: 1; }
  .row button { width: auto; margin-top: 0; padding: 0 14px; }
  .step { display: none; }
  .step.active { display: block; }
  .hidden { display: none; }
  .status { font-size: 13px; color: #72767d; text-align: center; margin-top: 12px; min-height: 20px; white-space: pre-line; }
  .status.error { color: #ed4245; }
  .status.success { color: #3ba55c; }
</style>
</head>
<body>
<div class="card">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <h1>LiveChat</h1>
  <p class="subtitle" data-i18n="subtitle"></p>
  <p class="steps" id="steps"></p>

  <!-- Step 1: create the bot -->
  <div class="step active" id="step1">
    <ol id="instructions"></ol>
    <button id="portal-btn" data-i18n="openPortal"></button>
    <button class="secondary" id="next1-btn" data-i18n="haveToken"></button>
  </div>

  <!-- Step 2: paste the token, then invite the bot -->
  <div class="step" id="step2">
    <div class="field">
      <label for="token" data-i18n="tokenLabel"></label>
      <input type="password" id="token" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="tokenHint"></p>
      <p class="err-msg" id="token-err" data-i18n="tokenRequired"></p>
    </div>
    <button id="connect-btn" data-i18n="connect"></button>
    <div id="invite-block" class="hidden">
      <button id="invite-btn" data-i18n="invite"></button>
      <button id="next2-btn" data-i18n="next"></button>
    </div>
    <button class="secondary" id="back2-btn" data-i18n="back"></button>
  </div>

  <!-- Step 3: pick the channel -->
  <div class="step" id="step3">
    <div class="field">
      <label for="channel" data-i18n="channelLabel"></label>
      <div class="row">
        <select id="channel"></select>
        <button class="secondary" id="refresh-btn" data-i18n="refresh"></button>
      </div>
      <p class="hint" data-i18n="channelHint"></p>
    </div>
    <button class="hidden" id="invite2-btn" data-i18n="invite"></button>
    <button id="finish-btn" data-i18n="finish"></button>
  </div>

  <p class="status" id="status"></p>
</div>

<script src="wizard.js"></script>
</body>
</html>
