name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Windows: skip install scripts to avoid node-gyp issues, then rebuild
      # only the one native module that actually needs a compiled binary.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --ignore-scripts
          npm rebuild better-sqlite3

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test
