name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # The E2E suite runs the server under plain Node: make sure better-sqlite3
      # is built for the Node ABI (packaging rebuilds it for Electron), or every
      # require() fails with ERR_DLOPEN_FAILED (NODE_MODULE_VERSION mismatch).
      - name: Rebuild native deps for Node ABI
        run: npm rebuild better-sqlite3

      - name: Smoke check – better-sqlite3 and yt-dlp
        run: |
          node -e "
          const Database = require('better-sqlite3');
          const db = new Database(':memory:');
          db.close();
          console.log('better-sqlite3: ok');

          const fs = require('fs');
          const path = require('path');
          const isWin = process.platform === 'win32';
          const ytDlp = path.join(process.cwd(), '.venv', isWin ? 'Scripts' : 'bin', isWin ? 'yt-dlp.exe' : 'yt-dlp');
          if (!fs.existsSync(ytDlp)) { console.error('yt-dlp not found at', ytDlp); process.exit(1); }
          console.log('yt-dlp: ok');
          "

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      # Traces and screenshots of failed tests, to debug without re-running locally.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
