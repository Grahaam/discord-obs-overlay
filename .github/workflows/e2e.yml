name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Smoke check – better-sqlite3 and yt-dlp
        run: |
          node -e "
          const Database = require('better-sqlite3');
          const db = new Database(':memory:');
          db.close();
          console.log('better-sqlite3: ok');

          const fs = require('fs');
          const path = require('path');
          const isWin = process.platform === 'win32';
          const ytDlp = path.join(process.cwd(), '.venv', isWin ? 'Scripts' : 'bin', isWin ? 'yt-dlp.exe' : 'yt-dlp');
          if (!fs.existsSync(ytDlp)) { console.error('yt-dlp not found at', ytDlp); process.exit(1); }
          console.log('yt-dlp: ok');
          "

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      # Traces and screenshots of failed tests, to debug without re-running locally.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
