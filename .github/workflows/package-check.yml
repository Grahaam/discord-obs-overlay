name: Package check

# Builds the Windows installer exactly like the release workflow, but only uploads it as a CI artifact
# (no GitHub Release, so installed apps are not offered an update) and reports its size. Runs on PRs
# that touch packaging, or by hand.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "scripts/**"
      - ".github/workflows/package-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build installer (win)
        run: npm run electron:build:win

      - name: Report sizes
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-electron -Filter "*Setup*.exe" | Select-Object -First 1
          $unpacked = (Get-ChildItem dist-electron/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          $lines = @(
            "### Windows package",
            "| | Size |",
            "|---|---|",
            ("| Installer ``{0}`` (download) | {1:N1} MB |" -f $installer.Name, ($installer.Length / 1MB)),
            ("| Installed app (``win-unpacked``) | {0:N1} MB |" -f ($unpacked / 1MB))
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Write-Output

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livechat-win-installer
          path: dist-electron/*Setup*.exe
          if-no-files-found: error
          retention-days: 7
